<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensorGrid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>SensorGrid</h1>
    <p>Simple Sensor Monitoring Dashboard</p>
</header>

<nav>
    <a href="#dashboard">Dashboard</a>
    <a href="#sensors">Sensors</a>
    <a href="#alerts">Alerts</a>
</nav>

<main>

<section id="dashboard">
    <h2>Dashboard</h2>

    <div class="cards">
        <article>
            <h3>Temperature</h3>
            <p>27 °C</p>
        </article>

        <article>
            <h3>Humidity</h3>
            <p>60%</p>
        </article>

        <article>
            <h3>LED Status</h3>
            <p id="ledStatus">OFF</p>
        </article>
    </div>
</section>

<section id="sensors">
    <h2>Sensors</h2>
    <p>Temperature Sensor: <strong>Active</strong></p>
    <p>Humidity Sensor: <strong>Active</strong></p>
</section>

<section id="alerts">
    <h2>Alerts</h2>
    <p>No active alerts.</p>
</section>

</main>

<footer>
    <p>SensorGrid Project | ESP32</p>
</footer>

</body>
</html>
